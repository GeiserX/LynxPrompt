name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'packages/**'
      - 'prisma/**'
      - 'public/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vitest.config.*'
      - 'next.config.*'
      - '.github/workflows/ci.yml'
  # No path filter on pull requests: CI Summary is a required check, and a
  # required check that never starts blocks the PR forever.
  pull_request:
    branches: [main, develop]
  # release.yml runs lint, tests and build before it tags an app release.
  workflow_call:

# Cancel in-progress runs when a new commit is pushed. The workflow name keeps
# the release workflow's call apart from the CI run of the same push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma clients
        run: npm run db:generate
        env:
          DATABASE_URL_APP: "postgresql://mock:mock@localhost:5432/mock"
          DATABASE_URL_USERS: "postgresql://mock:mock@localhost:5432/mock"
          DATABASE_URL_BLOG: "postgresql://mock:mock@localhost:5432/mock"
          DATABASE_URL_SUPPORT: "postgresql://mock:mock@localhost:5432/mock"

      - name: Type check
        run: npm run typecheck

      # TODO: Re-enable once eslint-config-next@16 FlatCompat circular structure bug is fixed
      # See: https://github.com/vercel/next.js/issues — FlatCompat + ESLint 9 crash
      # - name: Lint
      #   run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma clients
        run: npm run db:generate
        env:
          DATABASE_URL_APP: "postgresql://mock:mock@localhost:5432/mock"
          DATABASE_URL_USERS: "postgresql://mock:mock@localhost:5432/mock"
          DATABASE_URL_BLOG: "postgresql://mock:mock@localhost:5432/mock"
          DATABASE_URL_SUPPORT: "postgresql://mock:mock@localhost:5432/mock"

      - name: Run tests
        run: npm test -- --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          flags: unittests
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma clients
        run: npm run db:generate
        env:
          DATABASE_URL_APP: "postgresql://mock:mock@localhost:5432/mock"
          DATABASE_URL_USERS: "postgresql://mock:mock@localhost:5432/mock"
          DATABASE_URL_BLOG: "postgresql://mock:mock@localhost:5432/mock"
          DATABASE_URL_SUPPORT: "postgresql://mock:mock@localhost:5432/mock"

      - name: Build application
        run: npm run build
        env:
          # Disable telemetry during build
          NEXT_TELEMETRY_DISABLED: 1
          # Mock environment for build
          DATABASE_URL_APP: "postgresql://mock:mock@localhost:5432/mock"
          DATABASE_URL_USERS: "postgresql://mock:mock@localhost:5432/mock"
          DATABASE_URL_BLOG: "postgresql://mock:mock@localhost:5432/mock"
          DATABASE_URL_SUPPORT: "postgresql://mock:mock@localhost:5432/mock"
          NEXTAUTH_SECRET: "build-time-secret-not-used"
          NEXTAUTH_URL: "http://localhost:3000"

  # Checks the dev deployment answers after a push. Retries ride out a short
  # blip; a dev server that stays down turns the run red.
  integration-smoke:
    name: Integration Smoke Tests
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.workflow == 'CI'
    env:
      CURL: curl -sSf --retry 3 --retry-all-errors --retry-delay 10 --max-time 15
    steps:
      - name: Health endpoint
        run: |
          RESPONSE=$($CURL https://dev.lynxprompt.com/api/health)
          echo "$RESPONSE"
          echo "$RESPONSE" | jq -e '.status == "ok" and .db == "connected"' > /dev/null
          echo "✅ Health endpoint OK"

      - name: Public config endpoint
        run: |
          RESPONSE=$($CURL https://dev.lynxprompt.com/api/config/public)
          echo "$RESPONSE" | jq -e '.enableEmailAuth != null and .appName != null and .appUrl != null' > /dev/null
          echo "✅ Public config endpoint OK"

      - name: Homepage returns 200
        run: |
          $CURL -o /dev/null https://dev.lynxprompt.com/
          echo "✅ Homepage returns 200"

      - name: Login page returns 200
        run: |
          $CURL -o /dev/null https://dev.lynxprompt.com/auth/signin
          echo "✅ Login page returns 200"

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo "❌ CI failed"
            exit 1
          fi
          echo "✅ All checks passed"
