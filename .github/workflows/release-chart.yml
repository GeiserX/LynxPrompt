name: Release Helm Chart

on:
  push:
    branches:
      - main
    paths:
      - 'charts/lynxprompt/**'
      - '.github/workflows/release-chart.yml'
  workflow_dispatch:

# One chart release at a time per ref. GitHub keeps only one pending job per
# concurrency group, so without this a second chart release could wait on
# `gh-pages` beside a docs deploy and cancel it, or be cancelled by it. A newer
# run still covers a cancelled one: chart-releaser releases every chart changed
# since the last release tag.
concurrency:
  group: chart-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    # gh-pages is also the docs site: docs.yml syncs the site into it. Both
    # workflows take this lock so they never push to the branch at once.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: charts
          config: .github/cr.yaml
          skip_existing: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # chart-releaser can finish without the chart being installable (the index
      # lives on GitHub Pages, which deploys after the push). Wait until a plain
      # `helm pull` of this chart version works, as a user's would.
      - name: Check the chart is installable
        env:
          REPO_URL: https://geiserx.github.io/LynxPrompt
        run: |
          VERSION=$(sed -n "s/^version: *//p" charts/lynxprompt/Chart.yaml)
          for i in $(seq 1 40); do
            if helm repo add lynxprompt "$REPO_URL" --force-update >/dev/null 2>&1 &&
              helm pull lynxprompt/lynxprompt --version "$VERSION" --destination "$RUNNER_TEMP" >/dev/null 2>&1; then
              echo "lynxprompt chart $VERSION installs from $REPO_URL"
              exit 0
            fi
            sleep 30
          done
          echo "::error::lynxprompt chart $VERSION is not in $REPO_URL after 20 minutes"
          exit 1
