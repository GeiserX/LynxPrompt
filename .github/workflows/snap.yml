name: Snap package

# Builds the snap from snap/snapcraft.yaml on amd64 and arm64, installs it and
# checks that it runs. A pull request that touches the snap only builds it; the
# CLI release calls this with publish: true to upload it to the stable channel.
# Until 2.1.41 the release built a second, broken cli/snap/snapcraft.yaml, so no
# snap after 2.1.1 ever reached the store.
on:
  pull_request:
    paths:
      - 'snap/**'
      - '.github/workflows/snap.yml'
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      ref:
        type: string
        required: true
      publish:
        type: boolean
        default: false
    secrets:
      SNAPCRAFT_STORE_CREDENTIALS:
        required: false

permissions:
  contents: read

jobs:
  snap:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, arch: amd64 }
          - { runner: ubuntu-22.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Snapcraft
        run: sudo snap install snapcraft --classic

      # A release fails here, before the build, when the store login is missing
      # or expired. Pull requests from this repository have the secret too, so
      # they catch an expired login before a release does; forks skip the check.
      # The login is visible only to this step and the upload, never to the
      # build or to the CLI the snap installs.
      - name: Check the Snap Store login
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [ "$PUBLISH" != "true" ] && [ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo "no store login here (a fork); skipping the check"
            exit 0
          fi
          renew="create one with 'snapcraft export-login --snaps=lynxprompt --acls=package_access,package_push,package_update,package_release lynxprompt.login', then 'gh secret set SNAPCRAFT_STORE_CREDENTIALS -R ${{ github.repository }} < lynxprompt.login'"
          if [ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo "::error::secret SNAPCRAFT_STORE_CREDENTIALS is not set; $renew"
            exit 1
          fi
          # whoami also prints the account e-mail; this log is public, so show the expiry only.
          if ! out=$(snapcraft whoami 2>&1); then
            echo "::error::the Snap Store rejects SNAPCRAFT_STORE_CREDENTIALS (expired or revoked); $renew"
            exit 1
          fi
          grep -E '^expires:' <<<"$out" || echo "the login shows no expiry"

      - name: Set the version
        if: ${{ inputs.version != '' }}
        run: |
          sed -i "s/^version: .*/version: '${{ inputs.version }}'/" snap/snapcraft.yaml
          sed -i "s/lynxprompt@[0-9.]*/lynxprompt@${{ inputs.version }}/" snap/snapcraft.yaml

      # Built straight on the runner, which matches the snap's core22 base (Ubuntu
      # 22.04). Inside an LXD instance on the arm64 runner the Node download from
      # nodejs.org stalled in three of four builds.
      # The snap installs lynxprompt from npm, and the registry can take a few
      # minutes to serve a version it just accepted (2.1.42's snap failed with
      # ETARGET one minute after the publish). Wait for it before building.
      - name: Wait until npm serves this version
        run: |
          want=$(sed -n "s/.*lynxprompt@\([0-9][0-9.]*\).*/\1/p" snap/snapcraft.yaml | head -n1)
          for i in $(seq 1 30); do
            [ "$(npm view "lynxprompt@$want" version 2>/dev/null)" = "$want" ] && { echo "npm serves lynxprompt@$want"; exit 0; }
            sleep 20
          done
          echo "::error::npm still does not serve lynxprompt@$want after 10 minutes"
          exit 1

      - name: Build the snap
        run: sudo snapcraft pack --destructive-mode

      - name: Check the snap installs and runs
        id: snap
        run: |
          want=$(sed -n "s/^version: '\(.*\)'$/\1/p" snap/snapcraft.yaml)
          file="lynxprompt_${want}_${{ matrix.arch }}.snap"
          [ -f "$file" ] || { echo "::error::snapcraft did not produce $file"; ls -la; exit 1; }
          sudo snap install --dangerous "./$file"
          got=$(/snap/bin/lynxprompt --version)
          [ "$got" = "$want" ] || { echo "::error::the snap's lynxprompt --version printed '$got', expected $want"; exit 1; }
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Upload to the Snap Store
        if: ${{ inputs.publish }}
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: snapcraft upload --release=stable "${{ steps.snap.outputs.file }}"
