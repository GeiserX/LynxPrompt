name: Deploy to Development

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-development
  cancel-in-progress: true

jobs:
  # The development server is the one the DEV_URL repository variable names.
  # There is none today, so with DEV_URL unset nothing is built or deployed.
  deploy:
    name: Deploy to Development
    if: vars.DEV_URL != ''
    runs-on: ubuntu-latest
    environment:
      name: development
      url: ${{ vars.DEV_URL }}
    env:
      DEV_URL: ${{ vars.DEV_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Ensure jq is available
        run: |
          if ! command -v jq &>/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq jq
          fi

      - name: Generate version
        id: version
        run: |
          VERSION="dev-$(date +%Y%m%d)-$(git rev-parse --short HEAD)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Building version: $VERSION"

      - name: Log into Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push Docker image
        run: |
          docker buildx build --platform linux/amd64 \
            --build-arg APP_URL="$DEV_URL" \
            -t drumsergio/lynxprompt:${{ steps.version.outputs.version }} \
            -t drumsergio/lynxprompt:dev-latest \
            --push .

      - name: Update the development stack in the GitOps repo
        run: |
          cd /tmp
          rm -rf gitops-deploy
          GIT_CRED_HELPER='!f() { echo "username=${{ secrets.GITEA_USERNAME }}"; echo "password=${{ secrets.GITEA_TOKEN }}"; }; f'
          git -c credential.helper="$GIT_CRED_HELPER" clone "${{ vars.GITOPS_DEV_REPO_URL }}" gitops-deploy
          cd gitops-deploy
          git config credential.helper "$GIT_CRED_HELPER"

          # Update image tag
          sed -i 's|image: drumsergio/lynxprompt:.*|image: drumsergio/lynxprompt:${{ steps.version.outputs.version }}|' lynxprompt-dev/docker-compose.yml

          # Commit and push (triggers webhook auto-deploy)
          git config user.email "github-actions@lynxprompt.com"
          git config user.name "GitHub Actions"
          git add -A
          git commit -m "deploy: update lynxprompt-dev to ${{ steps.version.outputs.version }}" || echo "No changes"
          git push origin main

          cd /tmp && rm -rf gitops-deploy

      # Every check fails the run: a deploy that did not come up must not look green
      - name: Health check
        run: |
          sleep 30
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" $DEV_URL/api/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ App is responding"
              break
            fi
            echo "Waiting for site to be healthy... (attempt $i/10, status: $STATUS)"
            sleep 10
            if [ "$i" = "10" ]; then
              echo "::error::Health check timed out"
              exit 1
            fi
          done

          HEALTH=$(curl -sf $DEV_URL/api/health)
          echo "Health: $HEALTH"
          echo "$HEALTH" | jq -e '.status == "ok" and .db == "connected"' > /dev/null || {
            echo "::error::DB not connected"
            exit 1
          }

          CONFIG=$(curl -sf $DEV_URL/api/config/public)
          echo "Config: $CONFIG"
          echo "$CONFIG" | jq -e '.enableEmailAuth != null and .appName != null' > /dev/null || {
            echo "::error::Public config has an unexpected shape"
            exit 1
          }

          HOME_STATUS=$(curl -s -o /dev/null -w "%{http_code}" $DEV_URL/)
          if [ "$HOME_STATUS" = "200" ]; then
            echo "✅ Homepage returns 200"
          else
            echo "::error::Homepage returned $HOME_STATUS"
            exit 1
          fi

          echo "✅ Development deployment verified"
