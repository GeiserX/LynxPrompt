name: Publish CLI

on:
  # Trigger after CLI release is created
  release:
    types: [published]

  # Trigger from release workflow
  repository_dispatch:
    types: [cli-release]

  # Manual trigger
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (leave empty to use package.json)'
        required: false
        type: string
      platforms:
        description: 'Platforms to publish to'
        required: true
        type: choice
        options:
          - 'all'
          - 'npm-only'
          - 'npm-chocolatey'
          - 'npm-snap'
        default: 'all'

permissions:
  contents: write

jobs:
  # ===========================================
  # Check if this is a CLI release
  # ===========================================
  check:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      version: ${{ steps.version.outputs.version }}
      platforms: ${{ steps.platforms.outputs.platforms }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check if CLI release
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "✅ Manual trigger - will publish"
          elif [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "✅ Repository dispatch trigger - will publish"
          elif [[ "${{ github.event.release.tag_name }}" == cli-v* ]]; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "✅ CLI release detected - will publish"
          else
            echo "should_publish=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Not a CLI release, skipping"
          fi

      - name: Get version
        id: version
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            VERSION="${{ github.event.client_payload.version }}"
            if [[ -z "$VERSION" ]]; then
              VERSION=$(node -p "require('./cli/package.json').version")
            fi
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.release.tag_name }}" == cli-v* ]]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#cli-v}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            VERSION=$(node -p "require('./cli/package.json').version")
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Get platforms
        id: platforms
        run: |
          echo "platforms=${{ github.event.inputs.platforms || 'all' }}" >> $GITHUB_OUTPUT

  # ===========================================
  # Publish to npm
  # ===========================================
  publish-npm:
    needs: check
    if: ${{ needs.check.outputs.should_publish == 'true' }}
    runs-on: ubuntu-latest
    # npm trusted publishing: GitHub's OIDC token proves who publishes, so no NPM_TOKEN to expire.
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: cli
    outputs:
      version: ${{ needs.check.outputs.version }}
      tarball_sha256: ${{ steps.sha.outputs.sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Build shared package
        working-directory: .
        run: npx --yes --package typescript tsc -p packages/shared/tsconfig.json

      - name: Install dependencies
        run: npm ci

      - name: Ensure version matches
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          TARGET="${{ needs.check.outputs.version }}"
          if [[ "$CURRENT" != "$TARGET" ]]; then
            npm version "$TARGET" --no-git-tag-version
            echo "📦 Updated version from $CURRENT to $TARGET"
          fi

      - name: Build
        run: npm run build

      - name: Check if version exists on npm
        id: npm_check
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          if npm view "lynxprompt@$VERSION" version 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⚠️ Version $VERSION already exists on npm"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        if: ${{ steps.npm_check.outputs.exists != 'true' }}
        run: |
          # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships npm 10.
          npm install -g npm@^11.5.1
          npm publish --access public --loglevel verbose

      - name: Get tarball SHA256
        id: sha
        run: |
          sleep 10
          SHA=$(curl -sL "https://registry.npmjs.org/lynxprompt/-/lynxprompt-${{ needs.check.outputs.version }}.tgz" | sha256sum | cut -d' ' -f1)
          echo "sha256=$SHA" >> $GITHUB_OUTPUT

  # ===========================================
  # Build and upload standalone binaries
  # ===========================================
  publish-binaries:
    needs: [check, publish-npm]
    if: ${{ needs.check.outputs.should_publish == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build shared package
        working-directory: .
        run: npx --yes --package typescript tsc -p packages/shared/tsconfig.json

      - name: Install dependencies
        run: npm ci

      - name: Ensure version matches
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          TARGET="${{ needs.check.outputs.version }}"
          if [[ "$CURRENT" != "$TARGET" ]]; then
            npm version "$TARGET" --no-git-tag-version
          fi

      - name: Build standalone binaries
        run: npm run build:binaries

      - name: Package binaries
        run: |
          cd binaries
          VERSION="${{ needs.check.outputs.version }}"
          
          # Linux x64
          mv lynxprompt-linux-x64 lynxprompt
          tar -czvf "lynxprompt-${VERSION}-linux-x64.tar.gz" lynxprompt
          rm lynxprompt
          
          # Linux arm64
          mv lynxprompt-linux-arm64 lynxprompt
          tar -czvf "lynxprompt-${VERSION}-linux-arm64.tar.gz" lynxprompt
          rm lynxprompt
          
          # macOS binaries are built, signed and packaged by sign-macos

          # Windows x64
          mv lynxprompt-win-x64.exe lynxprompt.exe
          zip "lynxprompt-${VERSION}-win-x64.zip" lynxprompt.exe
          rm lynxprompt.exe
          
          ls -la

      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: cli-v${{ needs.check.outputs.version }}
          files: |
            cli/binaries/*.tar.gz
            cli/binaries/*.zip
          fail_on_unmatched_files: false

  # ===========================================
  # Sign and notarize the macOS binaries
  # ===========================================
  # Apple Silicon kills an unsigned binary on launch, so the macOS binaries are
  # signed with the Developer ID certificate under the hardened runtime and
  # notarized before they are packed and attached. A missing secret fails the
  # job: a macOS binary must never ship unsigned without anyone noticing. Bare
  # binaries cannot be stapled; Gatekeeper checks the ticket online.
  sign-macos:
    needs: [check, publish-npm]
    if: ${{ needs.check.outputs.should_publish == 'true' }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: cli

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build shared package
        working-directory: .
        run: npx --yes --package typescript tsc -p packages/shared/tsconfig.json

      - name: Install dependencies
        run: npm ci

      - name: Ensure version matches
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          TARGET="${{ needs.check.outputs.version }}"
          if [[ "$CURRENT" != "$TARGET" ]]; then
            npm version "$TARGET" --no-git-tag-version
          fi

      # pkg cannot load the ESM build or its dependencies' "#imports", so it gets
      # one CommonJS bundle instead. It also compiles bytecode by running the
      # target's own Node, which a host of the other architecture cannot do, and
      # then packs the scripts empty; shipping plain sources avoids that.
      - name: Build macOS binaries
        run: |
          npm run build
          npx --no-install esbuild dist/index.js --bundle --platform=node --format=cjs --target=node22 \
            --define:import.meta.url=__import_meta_url \
            "--banner:js=const __import_meta_url = require('url').pathToFileURL(__filename).href;" \
            --outfile=binaries/lynxprompt.cjs
          npx pkg binaries/lynxprompt.cjs --no-bytecode --public-packages "*" --public \
            --targets node22-macos-x64,node22-macos-arm64 --out-path binaries
          # With a single platform, pkg names the outputs by arch only
          for arch in x64 arm64; do mv "binaries/lynxprompt-$arch" "binaries/lynxprompt-macos-$arch"; done
          ls -la binaries

      - name: Sign and notarize
        working-directory: cli/binaries
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || { echo "::error::secret $v is not set; refusing to ship an unsigned macOS binary"; exit 1; }
          done

          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_pass="$(openssl rand -hex 16)"
          security create-keychain -p "$keychain_pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_pass" "$keychain"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_pass" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain"

          # V8 needs to write executable memory, which the hardened runtime forbids
          # unless these entitlements are granted (the same ones Node.js ships with).
          cat > "$RUNNER_TEMP/entitlements.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.cs.allow-jit</key>
            <true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
            <true/>
          </dict>
          </plist>
          EOF

          # Rosetta runs the x64 binary for the launch check below.
          sudo softwareupdate --install-rosetta --agree-to-license

          for arch in x64 arm64; do
            bin="lynxprompt-macos-$arch"
            codesign --force --options runtime --timestamp --entitlements "$RUNNER_TEMP/entitlements.plist" \
              --keychain "$keychain" --sign "$APPLE_SIGNING_IDENTITY" "$bin"
            codesign --verify --strict --verbose=2 "$bin"

            # pkg appends its payload to the Mach-O; prove the signed binary still runs.
            if [ "$arch" = x64 ]; then run="arch -x86_64 ./$bin"; else run="./$bin"; fi
            got=$($run --version)
            [ "$got" = "${{ needs.check.outputs.version }}" ] || { echo "::error::$bin --version printed '$got'"; exit 1; }

            ditto -c -k "$bin" "$RUNNER_TEMP/$bin.zip"
            status=$(xcrun notarytool submit "$RUNNER_TEMP/$bin.zip" \
              --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" \
              --wait --output-format json | tee /dev/stderr | jq -r .status)
            [ "$status" = Accepted ] || { echo "::error::notarization of $bin returned $status"; exit 1; }
          done

          security delete-keychain "$keychain"

      - name: Package macOS binaries
        working-directory: cli/binaries
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          for arch in x64 arm64; do
            mv "lynxprompt-macos-$arch" lynxprompt
            tar -czvf "lynxprompt-${VERSION}-macos-$arch.tar.gz" lynxprompt
            rm lynxprompt
          done
          ls -la

      - name: Upload macOS binaries to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: cli-v${{ needs.check.outputs.version }}
          files: cli/binaries/*.tar.gz
          fail_on_unmatched_files: true

  # ===========================================
  # Publish to Chocolatey (Windows)
  # ===========================================
  publish-chocolatey:
    needs: [check, publish-npm]
    if: ${{ needs.check.outputs.platforms == 'all' || needs.check.outputs.platforms == 'npm-chocolatey' }}
    runs-on: windows-latest
    # Secondary distribution channel (npm is primary). The self-hosted Windows
    # runner may lack the Chocolatey/pwsh toolchain, so never let it fail the
    # overall release; it self-heals once the runner toolchain is provisioned.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Update nuspec version
        shell: pwsh
        run: |
          $nuspec = Get-Content cli/chocolatey/lynxprompt.nuspec -Raw
          $nuspec = $nuspec -replace '<version>.*</version>', '<version>${{ needs.check.outputs.version }}</version>'
          Set-Content cli/chocolatey/lynxprompt.nuspec $nuspec

      - name: Update install script version
        shell: pwsh
        run: |
          $script = Get-Content cli/chocolatey/tools/chocolateyinstall.ps1 -Raw
          $script = $script -replace "\`$version = '[\d.]+'", "`$version = '${{ needs.check.outputs.version }}'"
          $script = $script -replace "lynxprompt@[\d.]+", "lynxprompt@${{ needs.check.outputs.version }}"
          Set-Content cli/chocolatey/tools/chocolateyinstall.ps1 $script

      - name: Pack Chocolatey package
        run: choco pack cli/chocolatey/lynxprompt.nuspec --out cli/chocolatey

      - name: Push to Chocolatey
        run: choco push cli/chocolatey/lynxprompt.${{ needs.check.outputs.version }}.nupkg --source https://push.chocolatey.org/ --api-key ${{ secrets.CHOCOLATEY_API_KEY }}
        continue-on-error: true

  # ===========================================
  # Publish to Snap Store (Linux)
  # ===========================================
  publish-snap:
    needs: [check, publish-npm]
    if: ${{ needs.check.outputs.platforms == 'all' || needs.check.outputs.platforms == 'npm-snap' }}
    runs-on: ubuntu-latest
    # Secondary distribution channel (npm is primary; the snap just re-wraps the
    # published npm package). snapd/LXD do not run in the Docker-based self-hosted
    # runner, so never let this fail the overall release; it self-heals once snap
    # infra is available on the runner.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Update snapcraft.yaml version
        run: |
          sed -i "s/^version: .*/version: '${{ needs.check.outputs.version }}'/" cli/snap/snapcraft.yaml
          sed -i "s/lynxprompt@[0-9.]*/lynxprompt@${{ needs.check.outputs.version }}/" cli/snap/snapcraft.yaml

      - name: Setup LXD
        uses: canonical/setup-lxd@main

      - name: Setup Snapcraft
        run: sudo snap install snapcraft --classic

      - name: Build Snap
        run: |
          cd cli
          snapcraft --use-lxd
        continue-on-error: true

      - name: Upload to Snap Store
        if: success()
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          cd cli
          snapcraft upload --release=stable lynxprompt_${{ needs.check.outputs.version }}_amd64.snap || true

  # ===========================================
  # Update Homebrew tap
  # ===========================================
  update-homebrew:
    needs: [check, publish-npm]
    if: ${{ needs.check.outputs.platforms == 'all' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: GeiserX/homebrew-lynxprompt
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        run: |
          cd homebrew-tap
          mkdir -p Formula
          cat > Formula/lynxprompt.rb << 'EOF'
          # typed: false
          # frozen_string_literal: true

          class Lynxprompt < Formula
            desc "CLI for LynxPrompt - Generate AI IDE configuration files"
            homepage "https://lynxprompt.com"
            url "https://registry.npmjs.org/lynxprompt/-/lynxprompt-${{ needs.check.outputs.version }}.tgz"
            sha256 "${{ needs.publish-npm.outputs.tarball_sha256 }}"
            license "SEE LICENSE IN LICENSE"

            depends_on "node@22"

            def install
              system "npm", "install", *std_npm_args
              bin.install_symlink Dir["#{libexec}/bin/*"]
            end

            test do
              assert_match "LynxPrompt CLI", shell_output("#{bin}/lynxprompt --help")
            end
          end
          EOF

      - name: Commit and push
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/lynxprompt.rb
          git diff --staged --quiet || git commit -m "Update lynxprompt to ${{ needs.check.outputs.version }}"
          git push
        continue-on-error: true

  # ===========================================
  # Summary
  # ===========================================
  summary:
    needs: [check, publish-npm, publish-binaries, sign-macos, publish-chocolatey, publish-snap, update-homebrew]
    if: always() && needs.check.outputs.should_publish == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Summary
        run: |
          echo "## CLI Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.check.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| npm | ${{ needs.publish-npm.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Standalone Binaries | ${{ needs.publish-binaries.result == 'success' && '✅' || needs.publish-binaries.result == 'skipped' && '⏭️' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS signing | ${{ needs.sign-macos.result == 'success' && '✅' || needs.sign-macos.result == 'skipped' && '⏭️' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Chocolatey | ${{ needs.publish-chocolatey.result == 'success' && '✅' || needs.publish-chocolatey.result == 'skipped' && '⏭️' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Snap | ${{ needs.publish-snap.result == 'success' && '✅' || needs.publish-snap.result == 'skipped' && '⏭️' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Homebrew | ${{ needs.update-homebrew.result == 'success' && '✅' || needs.update-homebrew.result == 'skipped' && '⏭️' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installation" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "# npm (requires Node.js)" >> $GITHUB_STEP_SUMMARY
          echo "npm install -g lynxprompt@${{ needs.check.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# Standalone binary (no dependencies)" >> $GITHUB_STEP_SUMMARY
          echo "# Download from: https://github.com/GeiserX/LynxPrompt/releases/tag/cli-v${{ needs.check.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
