name: Publish CLI

on:
  # Started by release.yml once the v<version> tag and release exist. (A release
  # created with GITHUB_TOKEN starts no workflow, so there is no release trigger.)
  repository_dispatch:
    types: [release-published]

  # Manual trigger
  workflow_dispatch:
    inputs:
      version:
        description: 'Released version to publish (leave empty to use cli/package.json)'
        required: false
        type: string
      platforms:
        description: 'Platforms to publish to'
        required: true
        type: choice
        options:
          - 'all'
          - 'npm-only'
          - 'npm-chocolatey'
          - 'npm-snap'
        default: 'all'

permissions:
  contents: write

# One publish at a time, in release order. Without this, two releases close
# together could finish out of order and move snap, AUR or Homebrew back to the
# older version.
concurrency:
  group: publish-cli
  cancel-in-progress: false
  queue: max

jobs:
  # ===========================================
  # Resolve the version and its release tag
  # ===========================================
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      ref: ${{ steps.ref.outputs.ref }}
      platforms: ${{ steps.platforms.outputs.platforms }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get version
        id: version
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            VERSION="${{ github.event.client_payload.version }}"
            if [[ -z "$VERSION" ]]; then
              VERSION=$(node -p "require('./cli/package.json').version")
            fi
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            VERSION=$(node -p "require('./cli/package.json').version")
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

      # Build the code that was tagged, not whatever main holds when the job
      # starts: a merge landing between the tag and this run would otherwise ship
      # untagged code under the tagged version.
      - name: Resolve the release tag
        id: ref
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::tag $TAG does not exist; publish only released versions"
            exit 1
          fi
          echo "ref=refs/tags/$TAG" >> $GITHUB_OUTPUT

      - name: Get platforms
        id: platforms
        run: |
          echo "platforms=${{ github.event.inputs.platforms || 'all' }}" >> $GITHUB_OUTPUT

  # ===========================================
  # Publish to npm
  # ===========================================
  publish-npm:
    needs: check
    runs-on: ubuntu-latest
    # npm trusted publishing: GitHub's OIDC token proves who publishes, so no NPM_TOKEN to expire.
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: cli
    outputs:
      version: ${{ needs.check.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Build shared package
        working-directory: .
        run: npx --yes --package typescript tsc -p packages/shared/tsconfig.json

      - name: Install dependencies
        run: npm ci

      - name: Ensure version matches
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          TARGET="${{ needs.check.outputs.version }}"
          if [[ "$CURRENT" != "$TARGET" ]]; then
            npm version "$TARGET" --no-git-tag-version
            echo "📦 Updated version from $CURRENT to $TARGET"
          fi

      - name: Build
        run: npm run build

      - name: Check if version exists on npm
        id: npm_check
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          if npm view "lynxprompt@$VERSION" version 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⚠️ Version $VERSION already exists on npm"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        if: ${{ steps.npm_check.outputs.exists != 'true' }}
        run: |
          # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships npm 10.
          npm install -g npm@^11.5.1
          npm publish --access public --loglevel verbose

  # ===========================================
  # Build and upload standalone binaries
  # ===========================================
  # Each runner builds, checks and packs the binary for its own platform, so a
  # binary that does not start never reaches the release.
  publish-binaries:
    needs: [check, publish-npm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: linux-x64, bin: lynxprompt }
          - { runner: ubuntu-24.04-arm, target: linux-arm64, bin: lynxprompt }
          - { runner: windows-latest, target: win-x64, bin: lynxprompt.exe }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: cli
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build shared package
        working-directory: .
        run: npx --yes --package typescript tsc -p packages/shared/tsconfig.json

      - name: Install dependencies
        run: npm ci

      - name: Ensure version matches
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          TARGET="${{ needs.check.outputs.version }}"
          if [[ "$CURRENT" != "$TARGET" ]]; then
            npm version "$TARGET" --no-git-tag-version
          fi

      - name: Build standalone binary
        run: |
          npm run build:bundle
          npm run pkg:bundle -- --targets node22-${{ matrix.target }} --output binaries/${{ matrix.bin }}

      - name: Check the binary starts
        run: |
          got=$(./binaries/${{ matrix.bin }} --version)
          [ "$got" = "${{ needs.check.outputs.version }}" ] || { echo "::error::${{ matrix.target }} --version printed '$got'"; exit 1; }

      - name: Package binary
        working-directory: cli/binaries
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          if [[ "${{ matrix.target }}" == win-* ]]; then
            7z a -tzip "lynxprompt-${VERSION}-${{ matrix.target }}.zip" "${{ matrix.bin }}"
          else
            tar -czvf "lynxprompt-${VERSION}-${{ matrix.target }}.tar.gz" "${{ matrix.bin }}"
          fi
          ls -la

      - name: Upload binary to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.check.outputs.version }}
          files: |
            cli/binaries/lynxprompt-*.tar.gz
            cli/binaries/lynxprompt-*.zip
          fail_on_unmatched_files: false

  # ===========================================
  # Sign and notarize the macOS binaries
  # ===========================================
  # Apple Silicon kills an unsigned binary on launch, so the macOS binaries are
  # signed with the Developer ID certificate under the hardened runtime and
  # notarized before they are packed and attached. A missing secret fails the
  # job: a macOS binary must never ship unsigned without anyone noticing. Bare
  # binaries cannot be stapled; Gatekeeper checks the ticket online.
  sign-macos:
    needs: [check, publish-npm]
    runs-on: macos-latest
    defaults:
      run:
        working-directory: cli

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build shared package
        working-directory: .
        run: npx --yes --package typescript tsc -p packages/shared/tsconfig.json

      - name: Install dependencies
        run: npm ci

      - name: Ensure version matches
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          TARGET="${{ needs.check.outputs.version }}"
          if [[ "$CURRENT" != "$TARGET" ]]; then
            npm version "$TARGET" --no-git-tag-version
          fi

      - name: Build macOS binaries
        run: |
          npm run build:bundle
          for arch in x64 arm64; do
            npm run pkg:bundle -- --targets "node22-macos-$arch" --output "binaries/lynxprompt-macos-$arch"
          done
          ls -la binaries

      - name: Sign and notarize
        working-directory: cli/binaries
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || { echo "::error::secret $v is not set; refusing to ship an unsigned macOS binary"; exit 1; }
          done

          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_pass="$(openssl rand -hex 16)"
          security create-keychain -p "$keychain_pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_pass" "$keychain"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_pass" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain"

          # V8 needs to write executable memory, which the hardened runtime forbids
          # unless these entitlements are granted (Node.js's own macOS build has them too).
          cat > "$RUNNER_TEMP/entitlements.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.cs.allow-jit</key>
            <true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
            <true/>
          </dict>
          </plist>
          EOF

          # Rosetta runs the x64 binary for the launch check below.
          sudo softwareupdate --install-rosetta --agree-to-license

          for arch in x64 arm64; do
            bin="lynxprompt-macos-$arch"
            codesign --force --options runtime --timestamp --entitlements "$RUNNER_TEMP/entitlements.plist" \
              --keychain "$keychain" --sign "$APPLE_SIGNING_IDENTITY" "$bin"
            codesign --verify --strict --verbose=2 "$bin"

            # pkg appends its payload to the Mach-O; prove the signed binary still runs.
            if [ "$arch" = x64 ]; then run="arch -x86_64 ./$bin"; else run="./$bin"; fi
            got=$($run --version)
            [ "$got" = "${{ needs.check.outputs.version }}" ] || { echo "::error::$bin --version printed '$got'"; exit 1; }

            ditto -c -k "$bin" "$RUNNER_TEMP/$bin.zip"
            status=$(xcrun notarytool submit "$RUNNER_TEMP/$bin.zip" \
              --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" \
              --wait --output-format json | tee /dev/stderr | jq -r .status)
            [ "$status" = Accepted ] || { echo "::error::notarization of $bin returned $status"; exit 1; }
          done

          security delete-keychain "$keychain"

      - name: Package macOS binaries
        working-directory: cli/binaries
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          for arch in x64 arm64; do
            mv "lynxprompt-macos-$arch" lynxprompt
            tar -czvf "lynxprompt-${VERSION}-macos-$arch.tar.gz" lynxprompt
            rm lynxprompt
          done
          ls -la

      - name: Upload macOS binaries to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.check.outputs.version }}
          files: cli/binaries/*.tar.gz
          fail_on_unmatched_files: true

  # ===========================================
  # Publish to Chocolatey (Windows)
  # ===========================================
  publish-chocolatey:
    needs: [check, publish-npm]
    if: ${{ needs.check.outputs.platforms == 'all' || needs.check.outputs.platforms == 'npm-chocolatey' }}
    runs-on: windows-latest
    # Secondary channel (npm is primary), so a failure here does not fail the
    # run, but the summary reports it: `published` is set only when the push
    # went through. Chocolatey then moderates the version before it is listed.
    continue-on-error: true
    outputs:
      published: ${{ steps.push.outcome == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.ref }}

      - name: Update nuspec version
        shell: pwsh
        run: |
          $nuspec = Get-Content cli/chocolatey/lynxprompt.nuspec -Raw
          $nuspec = $nuspec -replace '<version>.*</version>', '<version>${{ needs.check.outputs.version }}</version>'
          Set-Content cli/chocolatey/lynxprompt.nuspec $nuspec

      - name: Update install script version
        shell: pwsh
        run: |
          $script = Get-Content cli/chocolatey/tools/chocolateyinstall.ps1 -Raw
          $script = $script -replace "\`$version = '[\d.]+'", "`$version = '${{ needs.check.outputs.version }}'"
          $script = $script -replace "lynxprompt@[\d.]+", "lynxprompt@${{ needs.check.outputs.version }}"
          Set-Content cli/chocolatey/tools/chocolateyinstall.ps1 $script

      - name: Pack Chocolatey package
        run: choco pack cli/chocolatey/lynxprompt.nuspec --out cli/chocolatey

      - name: Push to Chocolatey
        id: push
        run: choco push cli/chocolatey/lynxprompt.${{ needs.check.outputs.version }}.nupkg --source https://push.chocolatey.org/ --api-key ${{ secrets.CHOCOLATEY_API_KEY }}

  # ===========================================
  # Publish to the Snap Store and the AUR (Linux)
  # ===========================================
  # Each builds, installs and runs the package before it publishes, and fails
  # the run when its store secret is missing or rejected: for months both
  # channels stayed on 2.1.1 while every run looked green.
  publish-snap:
    needs: [check, publish-npm]
    if: ${{ needs.check.outputs.platforms == 'all' || needs.check.outputs.platforms == 'npm-snap' }}
    permissions:
      contents: read
    uses: ./.github/workflows/snap.yml
    with:
      version: ${{ needs.check.outputs.version }}
      ref: ${{ needs.check.outputs.ref }}
      publish: true
    secrets:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}

  publish-aur:
    needs: [check, publish-npm]
    if: ${{ needs.check.outputs.platforms == 'all' }}
    permissions:
      contents: read
    uses: ./.github/workflows/aur.yml
    with:
      version: ${{ needs.check.outputs.version }}
      ref: ${{ needs.check.outputs.ref }}
      publish: true
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

  # ===========================================
  # Update Homebrew tap
  # ===========================================
  update-homebrew:
    needs: [check, publish-npm]
    if: ${{ needs.check.outputs.platforms == 'all' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.ref }}
          sparse-checkout: .github/scripts

      # The registry can answer 404 for a few seconds after npm publish; the
      # script waits for the real tarball and fails rather than hash anything else.
      - name: Get tarball SHA256
        id: sha
        run: |
          SHA=$(bash .github/scripts/npm-tarball-sha256.sh lynxprompt "${{ needs.check.outputs.version }}")
          echo "sha256=$SHA" >> $GITHUB_OUTPUT

      - name: Checkout Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: GeiserX/homebrew-lynxprompt
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        run: |
          cd homebrew-tap
          mkdir -p Formula
          cat > Formula/lynxprompt.rb << 'EOF'
          # typed: false
          # frozen_string_literal: true

          class Lynxprompt < Formula
            desc "CLI for LynxPrompt - Generate AI IDE configuration files"
            homepage "https://lynxprompt.geiser.cloud"
            url "https://registry.npmjs.org/lynxprompt/-/lynxprompt-${{ needs.check.outputs.version }}.tgz"
            sha256 "${{ steps.sha.outputs.sha256 }}"
            license "SEE LICENSE IN LICENSE"

            depends_on "node@22"

            def install
              system "npm", "install", *std_npm_args
              bin.install_symlink Dir["#{libexec}/bin/*"]
            end

            test do
              assert_match "LynxPrompt CLI", shell_output("#{bin}/lynxprompt --help")
            end
          end
          EOF

      - name: Commit and push
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/lynxprompt.rb
          git diff --staged --quiet || git commit -m "Update lynxprompt to ${{ needs.check.outputs.version }}"
          git push

  # ===========================================
  # Install the release from every primary channel
  # ===========================================
  # A channel can report success and still serve something broken (from 2.1.29
  # the Homebrew formula carried the hash of npm's 404 page), so the run is not
  # done until the published version installs and runs from npm and Homebrew
  # and the release holds every binary.
  verify:
    needs: [check, publish-npm, publish-binaries, sign-macos, update-homebrew]
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: npm serves the version
        run: |
          for i in $(seq 1 30); do
            got=$(npx --yes "lynxprompt@$VERSION" --version 2>/dev/null) && [ "$got" = "$VERSION" ] && { echo "npm: lynxprompt@$VERSION runs"; exit 0; }
            sleep 10
          done
          echo "::error::npx lynxprompt@$VERSION --version printed '${got:-nothing}'"
          exit 1

      - name: The release holds every binary
        run: |
          assets=$(gh release view "v$VERSION" -R "${{ github.repository }}" --json assets --jq '.assets[].name')
          status=0
          for target in linux-x64.tar.gz linux-arm64.tar.gz macos-x64.tar.gz macos-arm64.tar.gz win-x64.zip; do
            grep -qx "lynxprompt-$VERSION-$target" <<<"$assets" || { echo "::error::v$VERSION has no lynxprompt-$VERSION-$target"; status=1; }
          done
          exit $status

      - name: Homebrew installs the version
        if: ${{ needs.update-homebrew.result == 'success' }}
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          brew install GeiserX/lynxprompt/lynxprompt
          got=$("$(brew --prefix)/bin/lynxprompt" --version)
          [ "$got" = "$VERSION" ] || { echo "::error::brew installed lynxprompt $got, expected $VERSION"; exit 1; }
          echo "Homebrew: lynxprompt $VERSION runs"

  # ===========================================
  # Summary
  # ===========================================
  summary:
    needs: [check, publish-npm, publish-binaries, sign-macos, publish-chocolatey, publish-snap, publish-aur, update-homebrew, verify]
    if: always() && needs.check.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Summary
        run: |
          echo "## CLI Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.check.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| npm | ${{ needs.publish-npm.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Standalone Binaries | ${{ needs.publish-binaries.result == 'success' && '✅' || needs.publish-binaries.result == 'skipped' && '⏭️' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS signing | ${{ needs.sign-macos.result == 'success' && '✅' || needs.sign-macos.result == 'skipped' && '⏭️' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Chocolatey | ${{ needs.publish-chocolatey.outputs.published == 'true' && '✅ pushed, awaiting moderation' || needs.publish-chocolatey.result == 'skipped' && '⏭️' || '⚠️ failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Snap | ${{ needs.publish-snap.result == 'success' && '✅' || needs.publish-snap.result == 'skipped' && '⏭️' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| AUR | ${{ needs.publish-aur.result == 'success' && '✅' || needs.publish-aur.result == 'skipped' && '⏭️' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Homebrew | ${{ needs.update-homebrew.result == 'success' && '✅' || needs.update-homebrew.result == 'skipped' && '⏭️' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Install check | ${{ needs.verify.result == 'success' && '✅' || needs.verify.result == 'skipped' && '⏭️' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installation" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "# npm (requires Node.js)" >> $GITHUB_STEP_SUMMARY
          echo "npm install -g lynxprompt@${{ needs.check.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# Standalone binary (no dependencies)" >> $GITHUB_STEP_SUMMARY
          echo "# Download from: https://github.com/GeiserX/LynxPrompt/releases/tag/v${{ needs.check.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
