name: Release

# One release for the app and the CLI: one version, one v<version> tag and one
# GitHub release, from which the Docker image, npm, the binaries, Homebrew,
# Chocolatey, the Snap Store and the AUR are published.
#
# Every push to main runs the tests here (this is main's CI) and releases when
# something that ships changed since the last release. A manual run always
# releases; dry_run does every step except the tag, the release and the publishes.
on:
  push:
    branches: [main]
    # Pushes that cannot change what ships or what the tests check.
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'charts/**'
      - '*.md'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Bump from the last release (a higher version in package.json wins)'
        required: true
        type: choice
        options:
          - patch
          - minor
        default: patch
      dry_run:
        description: 'Compute and test everything, but create no tag, release or package'
        required: true
        type: boolean
        default: false

# One release at a time per ref, never cancelled. GitHub keeps one pending run
# per group and a newer push replaces it, so a burst of merges releases once
# more, with all of them, instead of once per merge. Dry runs have their own
# group so they never replace a pending real release.
concurrency:
  group: release-${{ github.ref }}-${{ inputs.dry_run && 'dry' || 'real' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      last: ${{ steps.version.outputs.last }}
      release: ${{ steps.decide.outputs.release }}
      dry_run: ${{ steps.decide.outputs.dry_run }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Next version
        id: version
        run: bash .github/scripts/release-version.sh "${{ inputs.bump || 'patch' }}" | tee -a "$GITHUB_OUTPUT"

      - name: Decide whether to release
        id: decide
        env:
          LAST: ${{ steps.version.outputs.last }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: |
          if [[ "$DRY_RUN" != true && "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::a real release runs only from main; use dry_run on $GITHUB_REF"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch || -z "$LAST" ]]; then
            RELEASE=true
          else
            # Shipped paths of the app and the CLI; the rule is in the script.
            RELEASE=$(bash .github/scripts/release-changes.sh all "$LAST")
          fi
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          echo "Release: $RELEASE (last release $LAST, dry run $DRY_RUN)"

  # ===========================================
  # Tests: nothing is tagged or published unless they pass
  # ===========================================
  ci:
    name: CI
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  cli-tests:
    name: CLI tests
    permissions:
      contents: read
    uses: ./.github/workflows/cli-tests.yml
    with:
      release: true

  # Builds the image for both platforms from the commit about to be tagged, so
  # a Dockerfile that no longer builds stops the release before the tag exists
  # instead of leaving a tag with no image. Reads the cache docker-publish.yml
  # writes, and pushes nothing.
  docker-smoke:
    name: Docker build (${{ matrix.arch }})
    needs: prepare
    if: ${{ needs.prepare.outputs.release == 'true' }}
    strategy:
      matrix:
        include:
          - { platform: linux/amd64, arch: amd64, runner: ubuntu-latest }
          - { platform: linux/arm64, arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          build-args: |
            APP_URL=https://lynxprompt.com
          cache-from: type=gha,scope=${{ matrix.arch }}

  # ===========================================
  # Tag, release, and start the publishes
  # ===========================================
  release:
    needs: [prepare, ci, cli-tests, docker-smoke]
    if: ${{ needs.prepare.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      LAST: ${{ needs.prepare.outputs.last }}
      TAG: v${{ needs.prepare.outputs.version }}
      DRY_RUN: ${{ needs.prepare.outputs.dry_run }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set the version in both packages
        run: |
          # Committed locally only, so the tag carries the version in package.json
          # and cli/package.json. The commit is never pushed to main: the branch
          # ruleset takes changes only through PRs, and release-version.sh derives
          # the next version from the tags, so main lagging behind is harmless.
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          (cd cli && npm version "$VERSION" --no-git-tag-version --allow-same-version)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json cli/package.json cli/package-lock.json
          git diff --cached --quiet || git commit -m "chore(release): $VERSION [skip ci]"

      - name: Release notes
        run: |
          # The CHANGELOG.md section of this version, or the commits since the last release.
          {
            echo "## What's Changed"
            echo ""
            if bash .github/scripts/changelog-section.sh "$VERSION" > notes.md; then
              cat notes.md
            else
              echo "CHANGELOG.md has no section for $VERSION; listing the commits instead" >&2
              git log ${LAST:+"$LAST"..}HEAD --no-merges --pretty=format:"- %s" | grep -v '^- chore(release):' | head -40
            fi
            echo ""
            echo "## Install"
            echo ""
            echo "- Docker: \`drumsergio/lynxprompt:$VERSION\` (linux/amd64 and linux/arm64, signed with cosign)"
            echo "- npm: \`npm install -g lynxprompt@$VERSION\`"
            echo "- Homebrew: \`brew install GeiserX/lynxprompt/lynxprompt\`"
            echo "- Chocolatey: \`choco install lynxprompt\`"
            echo "- Snap: \`snap install lynxprompt\`"
            echo "- AUR: \`lynxprompt\`"
            echo "- Standalone CLI binaries, no Node.js needed: the \`lynxprompt-$VERSION-<platform>\` assets below (linux-x64, linux-arm64, macos-x64, macos-arm64, win-x64)"
            if [ -n "$LAST" ]; then
              echo ""
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$LAST...$TAG"
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Create the tag
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          git tag -a "$TAG" -m "LynxPrompt $VERSION"
          git push origin "$TAG"

      - name: Create the GitHub release
        if: ${{ env.DRY_RUN != 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: LynxPrompt ${{ env.TAG }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          make_latest: 'true'
          generate_release_notes: false

      # docker-publish.yml publishes the image (then production and the
      # self-host pins follow), publish-cli.yml every CLI channel. Both build
      # the tag, never main.
      - name: Start the publishes
        if: ${{ env.DRY_RUN != 'true' }}
        uses: peter-evans/repository-dispatch@v4
        with:
          event-type: release-published
          client-payload: '{"version": "${{ env.VERSION }}"}'

      - name: Summary
        run: |
          {
            if [ "$DRY_RUN" = true ]; then
              echo "## Dry run: LynxPrompt $TAG would be released"
              echo ""
              echo "Nothing was tagged, released or published. A real run would:"
            else
              echo "## LynxPrompt $TAG released"
              echo ""
              echo "Started the publishes of:"
            fi
            echo ""
            echo "- Tag \`$TAG\` and the GitHub release \`LynxPrompt $TAG\`, marked Latest"
            echo "- Docker Hub \`drumsergio/lynxprompt:$VERSION\` (docker-publish.yml), then the production check and the self-host pins PR"
            echo "- npm \`lynxprompt@$VERSION\` and the five standalone binaries on the release (publish-cli.yml)"
            echo "- Homebrew, Chocolatey, the Snap Store and the AUR (publish-cli.yml)"
            echo ""
            echo "Last release: ${LAST:-none}"
            echo ""
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"
