name: Verify Production Deployment

on:
  repository_dispatch:
    types: [app-image-published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Released app version expected in production'
        required: true
        type: string
      revision:
        description: 'Full release commit SHA expected in production'
        required: true
        type: string
      digest:
        description: 'Expected image digest (optional for manual verification)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: verify-production
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Production Convergence
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://lynxprompt.com
    env:
      EXPECTED_VERSION: ${{ github.event.client_payload.version || inputs.version }}
      EXPECTED_REVISION: ${{ github.event.client_payload.revision || inputs.revision }}
      EXPECTED_DIGEST: ${{ github.event.client_payload.digest || inputs.digest }}

    steps:
      - name: Validate expected release
        run: |
          if [[ ! "$EXPECTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $EXPECTED_VERSION"
            exit 1
          fi
          if [[ ! "$EXPECTED_REVISION" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Invalid release revision"
            exit 1
          fi
          if [[ -n "$EXPECTED_DIGEST" && ! "$EXPECTED_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Invalid image digest"
            exit 1
          fi

      - name: Wait for private GitOps convergence
        run: |
          # SECURITY-REVIEW: Parse the public health response strictly with jq.
          for i in {1..120}; do
            RESPONSE=$(curl --fail --silent --show-error \
              --connect-timeout 5 --max-time 10 \
              https://lynxprompt.com/api/health 2>/dev/null || true)
            ACTUAL_VERSION=$(jq -r '.version // empty' <<< "$RESPONSE" 2>/dev/null || true)
            ACTUAL_REVISION=$(jq -r '.revision // empty' <<< "$RESPONSE" 2>/dev/null || true)
            STATUS=$(jq -r '.status // empty' <<< "$RESPONSE" 2>/dev/null || true)
            DB=$(jq -r '.db // empty' <<< "$RESPONSE" 2>/dev/null || true)

            if [[ "$STATUS" == "ok" &&
                  "$DB" == "connected" &&
                  "$ACTUAL_VERSION" == "$EXPECTED_VERSION" &&
                  "$ACTUAL_REVISION" == "$EXPECTED_REVISION" ]]; then
              echo "Production converged on LynxPrompt $EXPECTED_VERSION"
              exit 0
            fi

            echo "Waiting for $EXPECTED_VERSION@$EXPECTED_REVISION (attempt $i/120, running ${ACTUAL_VERSION:-unknown}@${ACTUAL_REVISION:-unknown})"
            sleep 10
          done

          echo "Production did not converge on $EXPECTED_VERSION within 20 minutes"
          exit 1

      - name: Purge Cloudflare cache
        run: |
          curl --fail-with-body --retry 3 --request POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"purge_everything":true}'

      - name: Record deployment provenance
        run: |
          {
            echo "## Production deployment verified"
            echo ""
            echo "- Version: \`$EXPECTED_VERSION\`"
            echo "- Source revision: \`$EXPECTED_REVISION\`"
            if [[ -n "$EXPECTED_DIGEST" ]]; then
              echo "- Image digest: \`$EXPECTED_DIGEST\`"
            fi
            echo "- Health: https://lynxprompt.com/api/health"
          } >> "$GITHUB_STEP_SUMMARY"
