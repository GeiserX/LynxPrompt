name: CLI Integration Tests

on:
  # On main, release.yml runs the build and the public tests on every push.
  push:
    branches: [develop]
    paths:
      - 'cli/**'
      - 'packages/shared/**'
      - '.github/workflows/cli-tests.yml'
  # No path filter on pull requests: the build and public tests are required
  # checks, and a required check that never starts blocks the PR forever.
  pull_request:
    branches: [main, develop]
  # release.yml runs the build and the public tests before it tags a CLI release.
  workflow_call:
    inputs:
      release:
        description: 'Called by the release workflow: skip the authenticated tests'
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      environment:
        description: 'Test environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

env:
  NODE_VERSION: '22'

# The jobs only check out code, build and run the CLI.
permissions:
  contents: read

jobs:
  # Basic tests without authentication
  public-tests:
    name: Public CLI Tests
    runs-on: ubuntu-latest
    needs: [build-test]
    if: ${{ needs.build-test.outputs.cli == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Test this commit's CLI, not the version already on npm: the build from
      # the Build CLI from Source job, with only its runtime dependencies.
      - name: Download the built CLI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-dist
          path: cli/dist

      - name: Install its runtime dependencies and link it
        working-directory: cli
        run: |
          npm ci --omit=dev
          chmod +x dist/index.js
          npm link

      - name: Verify CLI installation
        run: |
          lynxp --version
          lynxp --help

      # Flags, exit codes and tracked paths, against a local mock of the API
      - name: Test CLI behaviour regressions
        run: bash cli/test/regression.sh lynxp

      - name: Create test directory
        run: mkdir -p /tmp/lynxp-test && cd /tmp/lynxp-test

      - name: Test wizard (AGENTS.md)
        working-directory: /tmp/lynxp-test
        run: |
          lynxp wizard -y --name "CI Test Project"
          test -f AGENTS.md || exit 1
          echo "✓ AGENTS.md generated"

      - name: Test wizard (Cursor format)
        working-directory: /tmp/lynxp-test
        run: |
          lynxp wizard -y --name "Cursor Test" --format cursor
          test -f .cursor/rules/project.mdc || exit 1
          echo "✓ Cursor config generated"

      - name: Test check
        working-directory: /tmp/lynxp-test
        run: |
          lynxp check
          echo "✓ Check passed"

      - name: Test check --ci (exit code)
        working-directory: /tmp/lynxp-test
        run: |
          lynxp check --ci
          echo "✓ Check CI mode works (exit 0)"

      - name: Test status
        working-directory: /tmp/lynxp-test
        run: |
          lynxp status
          echo "✓ Status works"

      # Public search is read-only, so it runs against the hosted instance the
      # CLI ships for. The dev server it used was frozen at a May 2026 build
      # and lived on lynxprompt.com, which lapses on 2026-12-20.
      - name: Test search (public)
        env:
          LYNXPROMPT_API_URL: https://lynxprompt.geiser.cloud
        run: |
          lynxp search "nextjs" --limit 3
          echo "✓ Search works"

  # Pushes, links and lists blueprints with the CLI built from source, against
  # the development server named by the DEV_URL repository variable. There is
  # no development server today, so with DEV_URL unset the job only says so.
  authenticated-tests:
    name: Authenticated CLI Tests
    if: ${{ !inputs.release && needs.build-test.outputs.cli == 'true' }}
    runs-on: ubuntu-latest
    needs: [build-test]  # Uses the CLI that job built
    env:
      LYNXPROMPT_TOKEN: ${{ vars.DEV_URL && secrets.LYNXPROMPT_DEV_TOKEN || '' }}
      LYNXPROMPT_API_URL: ${{ vars.DEV_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download the built CLI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-dist
          path: cli/dist

      - name: Install its runtime dependencies and link it
        working-directory: cli
        run: |
          npm ci --omit=dev
          chmod +x dist/index.js
          npm link

      - name: Verify CLI is from source
        run: |
          lynxp --version
          echo "✓ CLI built from source"

      - name: Check for a development server and token
        run: |
          if [ -z "$LYNXPROMPT_API_URL" ]; then
            echo "::notice::No development server (repository variable DEV_URL is unset): authenticated tests skipped"
            exit 0
          fi
          if [ -z "$LYNXPROMPT_TOKEN" ]; then
            echo "::notice::LYNXPROMPT_DEV_TOKEN secret not set: authenticated tests skipped"
            exit 0
          fi
          echo "✓ Token available for $LYNXPROMPT_API_URL"

      # A server that never answers fails the run: testing against nothing
      # proves nothing
      - name: Wait for dev server to be healthy
        if: env.LYNXPROMPT_TOKEN != ''
        run: |
          echo "Checking dev server health..."
          for i in 1 2 3 4 5; do
            if curl -sf "$LYNXPROMPT_API_URL/api/health"; then
              echo
              echo "✓ Dev server is healthy"
              exit 0
            fi
            echo "Attempt $i: Server not ready, waiting 30s..."
            sleep 30
          done
          echo "::error::$LYNXPROMPT_API_URL/api/health did not answer"
          exit 1

      - name: Test whoami
        if: env.LYNXPROMPT_TOKEN != ''
        run: |
          # Retry up to 3 times in case server is still warming up
          for i in 1 2 3; do
            if lynxp whoami; then
              echo "✓ Authentication working"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "❌ whoami failed after 3 attempts"
          exit 1

      - name: Test list blueprints
        if: env.LYNXPROMPT_TOKEN != ''
        run: |
          lynxp list
          echo "✓ List works"

      - name: Create test directory
        if: env.LYNXPROMPT_TOKEN != ''
        run: mkdir -p /tmp/lynxp-auth-test && cd /tmp/lynxp-auth-test

      - name: Test push new blueprint
        if: env.LYNXPROMPT_TOKEN != ''
        working-directory: /tmp/lynxp-auth-test
        run: |
          echo "# CI Test Blueprint" > ci-test.md
          echo "" >> ci-test.md
          echo "Auto-generated by GitHub Actions CI" >> ci-test.md
          echo "Run: ${{ github.run_id }}" >> ci-test.md
          
          lynxp push ci-test.md --yes \
            --name "CI Test ${{ github.run_id }}" \
            --description "Auto-generated test blueprint" \
            --visibility PRIVATE
          
          echo "✓ Push new blueprint works"

      - name: Test link list
        if: env.LYNXPROMPT_TOKEN != ''
        working-directory: /tmp/lynxp-auth-test
        run: |
          lynxp link --list
          echo "✓ Link list works"

      - name: Test push update
        if: env.LYNXPROMPT_TOKEN != ''
        working-directory: /tmp/lynxp-auth-test
        run: |
          echo "" >> ci-test.md
          echo "## Updated" >> ci-test.md
          echo "Updated at $(date -u)" >> ci-test.md
          
          # No --force: a second push of a tracked file must pass the
          # optimistic lock, since the file ends in a newline and the
          # server stores it trimmed.
          lynxp push ci-test.md --yes
          echo "✓ Push update works"

      - name: Test status with linked blueprint
        if: env.LYNXPROMPT_TOKEN != ''
        working-directory: /tmp/lynxp-auth-test
        run: |
          lynxp status
          echo "✓ Status shows linked blueprint"

  # The one build of the CLI. The test jobs above install its dist from the
  # artifact instead of building again.
  build-test:
    name: Build CLI from Source
    runs-on: ubuntu-latest
    outputs:
      cli: ${{ steps.changes.outputs.cli }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request's merge commit and the base it merges into.
          fetch-depth: 2

      # The CLI is built from cli/ and packages/shared/ only, so a pull request
      # that changes neither cannot change what the test jobs check. They are
      # skipped there; jobs wait far longer for a runner than these run. This
      # job stays, because it is the required check. Every other event tests.
      - name: Did the CLI change?
        id: changes
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo "cli=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fails the job, rather than skipping the tests, if the diff cannot be read.
          files=$(git diff --name-only HEAD^1 HEAD)
          if grep -qE '^(cli/|packages/shared/|\.github/workflows/cli-tests\.yml$)' <<< "$files"; then
            echo "cli=true" >> "$GITHUB_OUTPUT"
          else
            echo "cli=false" >> "$GITHUB_OUTPUT"
            echo "No change to the CLI: the public and authenticated tests are skipped"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build shared package
        run: npx --yes --package typescript tsc -p packages/shared/tsconfig.json

      - name: Install dependencies
        working-directory: cli
        run: npm ci

      - name: Build
        working-directory: cli
        run: npm run build

      - name: Typecheck
        working-directory: cli
        run: npm run typecheck

      - name: Test built CLI
        working-directory: cli
        run: |
          node dist/index.js --version
          node dist/index.js --help
          echo "✓ Built CLI works"

      - name: Test convert keeps Markdown rules unchanged
        working-directory: cli
        run: |
          dir=$(mktemp -d)
          printf '# Project\n\nBuild with C:\\tools\\make.exe\nSay "hi" and end with a backslash \\\n' > "$dir/AGENTS.md"
          (cd "$dir" && node "$GITHUB_WORKSPACE/cli/dist/index.js" convert AGENTS.md crush)
          # CRUSH.md is plain Markdown; the text must come through unchanged
          diff "$dir/AGENTS.md" "$dir/CRUSH.md"
          echo "✓ Converted rules keep backslashes and quotes"

      - name: Upload the built CLI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-dist
          path: cli/dist
          if-no-files-found: error
          retention-days: 1
