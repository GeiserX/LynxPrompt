name: Docker Publish

on:
  # Started by release.yml once the v<version> tag and release exist.
  repository_dispatch:
    types: [release-published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Released version to publish (for example, 2.2.0)'
        required: true
        type: string

concurrency:
  group: docker-publish-production
  cancel-in-progress: false
  queue: max

env:
  DOCKER_IMAGE: drumsergio/lynxprompt

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      ref: ${{ steps.release.outputs.ref }}
      revision: ${{ steps.source.outputs.revision }}

    steps:
      - name: Validate release version
        id: release
        env:
          VERSION: ${{ github.event.client_payload.version || inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ref=refs/tags/v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.ref }}

      - name: Verify release tag contents
        id: source
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [[ "$PACKAGE_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "Release tag contains package version $PACKAGE_VERSION, expected $EXPECTED_VERSION"
            exit 1
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log into Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Reject an existing immutable release tag
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if docker buildx imagetools inspect "${DOCKER_IMAGE}:${VERSION}" >/dev/null 2>&1; then
            echo "Release image ${DOCKER_IMAGE}:${VERSION} already exists and is immutable"
            exit 1
          fi

  # Each platform builds natively on its own runner (no QEMU) and is pushed by
  # digest only; the publish job below joins them under the release tag.
  build:
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - { platform: linux/amd64, arch: amd64, runner: ubuntu-latest }
          - { platform: linux/arm64, arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKER_IMAGE }}

      # sbom and provenance attach an SPDX SBOM and a build provenance
      # attestation to the image, so `docker buildx imagetools inspect` shows
      # what is inside and how it was built.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.DOCKER_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.revision }}
          build-args: |
            APP_URL=https://lynxprompt.com
            APP_REVISION=${{ needs.prepare.outputs.revision }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Save digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::build returned no digest"; exit 1; }
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # Keyless cosign signing: the signature is bound to this workflow's
      # GitHub OIDC identity, so there is no signing key to keep.
      id-token: write

    steps:
      # The check script comes from the default branch, so a manual re-publish
      # of an older tag still has it.
      - name: Checkout scripts
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create the release tag
        working-directory: ${{ runner.temp }}/digests
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          [ "$(ls | wc -l)" -eq 2 ] || { echo "::error::expected 2 platform digests, got $(ls | wc -l)"; exit 1; }
          docker buildx imagetools create -t "${DOCKER_IMAGE}:${VERSION}" $(printf "${DOCKER_IMAGE}@sha256:%s " *)

      # The tag must serve both platforms, each with its SBOM and provenance.
      - name: Verify the published image
        id: verify
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          bash .github/scripts/check-image-platforms.sh "${DOCKER_IMAGE}:${VERSION}" linux/amd64 linux/arm64
          DIGEST=$(docker buildx imagetools inspect "${DOCKER_IMAGE}:${VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::no digest for ${DOCKER_IMAGE}:${VERSION}"; exit 1; }
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign the image
        env:
          IMAGE: ${{ env.DOCKER_IMAGE }}@${{ steps.verify.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE"
          # Docker Hub lists a new signature through its referrers index a few
          # seconds after the push, so a verify straight after signing can find
          # nothing. Retry for up to two minutes before calling it a failure.
          for attempt in 1 2 3 4 5 6 7 8; do
            if cosign verify "$IMAGE" \
              --certificate-identity "https://github.com/${{ github.workflow_ref }}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null; then
              exit 0
            fi
            echo "Signature not visible yet (attempt $attempt), retrying in 15 s"
            sleep 15
          done
          echo "::error::cosign could not verify the signature of $IMAGE"
          exit 1

      - name: Trigger production convergence verification
        uses: peter-evans/repository-dispatch@v4
        with:
          event-type: app-image-published
          client-payload: >-
            {"version":"${{ needs.prepare.outputs.version }}","revision":"${{ needs.prepare.outputs.revision }}","digest":"${{ steps.verify.outputs.digest }}"}
