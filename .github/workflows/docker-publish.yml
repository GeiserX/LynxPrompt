name: Docker Publish

on:
  repository_dispatch:
    types: [app-release]
  workflow_dispatch:
    inputs:
      version:
        description: 'Released app version to publish (for example, 2.1.13)'
        required: true
        type: string

concurrency:
  group: docker-publish-production
  cancel-in-progress: false
  queue: max

env:
  DOCKER_IMAGE: drumsergio/lynxprompt

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Validate release version
        id: release
        env:
          VERSION: ${{ github.event.client_payload.version || inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ref=refs/tags/app-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.ref }}
          fetch-depth: 0

      - name: Verify release tag contents
        id: source
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [[ "$PACKAGE_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "Release tag contains package version $PACKAGE_VERSION, expected $EXPECTED_VERSION"
            exit 1
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Reject an existing immutable release tag
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if docker buildx imagetools inspect "${DOCKER_IMAGE}:${VERSION}" >/dev/null 2>&1; then
            echo "Release image ${DOCKER_IMAGE}:${VERSION} already exists and is immutable"
            exit 1
          fi

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
          build-args: |
            NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ secrets.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            APP_URL=https://lynxprompt.com
            APP_REVISION=${{ steps.source.outputs.revision }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify immutable image
        env:
          VERSION: ${{ steps.release.outputs.version }}
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          ACTUAL_DIGEST=$(docker buildx imagetools inspect \
            "${DOCKER_IMAGE}:${VERSION}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          if [[ "$ACTUAL_DIGEST" != "$EXPECTED_DIGEST" ]]; then
            echo "Published digest $ACTUAL_DIGEST does not match build digest $EXPECTED_DIGEST"
            exit 1
          fi

      - name: Trigger production convergence verification
        uses: peter-evans/repository-dispatch@v4
        with:
          event-type: app-image-published
          client-payload: >-
            {"version":"${{ steps.release.outputs.version }}","revision":"${{ steps.source.outputs.revision }}","digest":"${{ steps.build.outputs.digest }}"}
