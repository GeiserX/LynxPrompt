# Try-out only: a local mailbox that catches the sign-in mail.
#   docker compose -f docker-compose.selfhost.yml -f docker-compose.mailpit.yml up -d
# then read the link at http://localhost:8025. Never use this in production:
# anyone who can open that port can sign in as anyone.
services:
  mailpit:
    image: axllent/mailpit:v1.31.3
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

  lynxprompt:
    environment:
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      # The app always logs in to SMTP; Mailpit accepts any login.
      SMTP_USER: mailpit
      SMTP_PASSWORD: mailpit
      SMTP_FROM: noreply@localhost
